<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found | STACKLY Industrial</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>         *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }                  :root {             --primary-color: #FF5E14;             --primary-hover: #e04b0b;             --bg-color: #080a0e;             --text-color: #eef2ff;             --text-muted: #8892a4;             --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);         }          body {             font-family: 'Inter', sans-serif;             background-color: var(--bg-color);             color: var(--text-color);             min-height: 100vh;             display: flex;             align-items: center;             justify-content: center;             overflow: hidden;             position: relative;         }          /* Background Effects */         .bg-glow {             position: absolute;             width: 600px;             height: 600px;             background: radial-gradient(circle, rgba(255, 94, 20, 0.15) 0%, rgba(255, 94, 20, 0) 70%);             top: 50%;             left: 50%;             transform: translate(-50%, -50%);             z-index: 0;             pointer-events: none;             animation: pulseGlow 6s infinite alternate ease-in-out;         }          .grid-bg {             position: absolute;             inset: 0;             background-image:                  linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),                 linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);             background-size: 40px 40px;             z-index: 0;             pointer-events: none;             opacity: 0.5;         }          /* Main Content */         .error-container {             position: relative;             z-index: 10;             text-align: center;             padding: 40px;         }          /* 404 Text Animation */         .error-code {             font-family: 'Oswald', sans-serif;             font-size: 180px;             font-weight: 800;             line-height: 1;             margin-bottom: 10px;             background: linear-gradient(135deg, #fff 0%, #8892a4 100%);             -webkit-background-clip: text;             -webkit-text-fill-color: transparent;             display: inline-flex;             align-items: center;             justify-content: center;             gap: 15px;             text-shadow: 0 10px 30px rgba(0,0,0,0.5);         }          .gear-icon {             color: var(--primary-color);             font-size: 140px;             -webkit-text-fill-color: var(--primary-color);             animation: spinGear 8s linear infinite;             filter: drop-shadow(0 0 20px rgba(255, 94, 20, 0.4));         }          .error-title {             font-family: 'Oswald', sans-serif;             font-size: 32px;             font-weight: 700;             margin-bottom: 16px;             letter-spacing: 1px;             opacity: 0;             animation: slideUp 0.6s ease forwards 0.3s;         }          .error-title span {             color: var(--primary-color);         }          .error-desc {             font-size: 16px;             color: var(--text-muted);             max-width: 480px;             margin: 0 auto 40px;             line-height: 1.6;             opacity: 0;             animation: slideUp 0.6s ease forwards 0.5s;         }          /* Buttons */         .action-btns {             display: flex;             align-items: center;             justify-content: center;             gap: 20px;             opacity: 0;             animation: slideUp 0.6s ease forwards 0.7s;         }          .btn-primary {             display: inline-flex;             align-items: center;             gap: 10px;             background-color: var(--primary-color);             color: #fff;             text-decoration: none;             padding: 14px 28px;             border-radius: 8px;             font-weight: 700;             font-size: 14px;             text-transform: uppercase;             letter-spacing: 1px;             transition: var(--transition);             box-shadow: 0 8px 24px rgba(255, 94, 20, 0.3);         }          .btn-primary:hover {             background-color: var(--primary-hover);             transform: translateY(-3px);             box-shadow: 0 12px 30px rgba(255, 94, 20, 0.4);         }          .btn-outline {             display: inline-flex;             align-items: center;             gap: 10px;             background-color: transparent;             color: var(--text-color);             text-decoration: none;             padding: 13px 27px;             border-radius: 8px;             font-weight: 600;             font-size: 14px;             border: 1px solid rgba(255, 255, 255, 0.15);             transition: var(--transition);         }          .btn-outline:hover {             border-color: var(--primary-color);             color: var(--primary-color);             background: rgba(255, 94, 20, 0.05);             transform: translateY(-3px);         }          /* Logo */         .logo {             position: absolute;             top: 40px;             left: 50%;             transform: translateX(-50%);             display: flex;             align-items: center;             gap: 12px;             text-decoration: none;             z-index: 20;             opacity: 0;             animation: slideDown 0.6s ease forwards 0.2s;         }          .logo-box {             width: 44px;             height: 44px;             background: linear-gradient(135deg, var(--primary-color), #ff8c52);             border-radius: 10px;             display: flex;             align-items: center;             justify-content: center;             font-family: 'Oswald', sans-serif;             font-weight: 800;             font-size: 16px;             color: #fff;             box-shadow: 0 0 20px rgba(255, 94, 20, 0.3);         }          .logo-text {             font-family: 'Oswald', sans-serif;             font-weight: 700;             font-size: 24px;             color: #fff;             letter-spacing: 0.5px;         }          .logo-text span {             color: var(--primary-color);         }          /* Animations */         @keyframes spinGear {             0% { transform: rotate(0deg); }             100% { transform: rotate(360deg); }         }          @keyframes pulseGlow {             0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }             100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }         }          @keyframes slideUp {             from { opacity: 0; transform: translateY(30px); }             to { opacity: 1; transform: translateY(0); }         }          @keyframes slideDown {             from { opacity: 0; transform: translate(-50%, -30px); }             to { opacity: 1; transform: translate(-50%, 0); }         }          /* Glitch effect on the numbers */         .glitch-wrapper {             position: relative;             display: inline-block;             animation: slideUp 0.6s ease forwards;         }          @media (max-width: 768px) {             .error-code { font-size: 120px; }             .gear-icon { font-size: 90px; }             .action-btns { flex-direction: column; width: 100%; max-width: 300px; margin: 0 auto; }             .btn-primary, .btn-outline { width: 100%; justify-content: center; }         }     </style>
</head>
<body>
<!-- Background Elements -->
<div class="grid-bg">
</div>
<div class="bg-glow">
</div>
<!-- Top Logo Removed -->
<!-- Main Content -->
<div class="error-container">
<div class="glitch-wrapper">
<div class="error-code">                 4<i class="fas fa-gear gear-icon">
</i>4             </div>
</div>
<h1 class="error-title">System <span>Malfunction</span>
</h1>
<p class="error-desc">             The page you are looking for has been moved, deleted, or doesn't exist in our industrial database. Let's get you back to operations.         </p>
<div class="action-btns">
<a href="index.html" class="btn-primary">
<i class="fas fa-arrow-left">
</i> Return to Base             </a>
<button onclick="window.history.back()" class="btn-outline" style="cursor: pointer;">
<i class="fas fa-rotate-left">
</i> Go Back             </button>
</div>
</div>
<script>         /*  */ addEventListener('mousemove', function(e) {             const glow = document.querySelector('.bg-glow');             const x = e.clientX / window.innerWidth - 0.5;             const y = e.clientY / window.innerHeight - 0.5;                          glow.style.transform = `translate(calc(-50% + ${x * 50}px), calc(-50% + ${y * 50}px))`;         });     </script>
</body>
</html>
